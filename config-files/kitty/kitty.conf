# Kitty Configuration - Minimal Gray Theme with Transparency

# Transparency and effects
background_opacity 0.85
dynamic_background_opacity yes
background_blur 1

# Colors matching your gray theme
foreground #e0e0e0
background #1a1a1a
cursor #888888

# Selection colors
selection_foreground #1a1a1a
selection_background #888888

# Font configuration
font_family JetBrains Mono
font_size 11.0

# Window padding
window_padding_width 8
window_padding_height 8

# No border
hide_window_decorations no

# Scrollback lines
scrollback_lines 2000

# Performance
sync_to_monitor yes
