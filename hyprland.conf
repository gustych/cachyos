
# #######################################################################################
# OPTIMIZED HYPRLAND CONFIG - Minimal & Clean with Fast Performance
# Configured by Claude Code for optimal robustness and aesthetics
# #######################################################################################

# This is an example Hyprland config file.
# Refer to the wiki for more information.
# https://wiki.hypr.land/Configuring/

# Please note not all available settings / options are set here.
# For a full list, see the wiki

# You can split this configuration into multiple files
# Create your files separately and then link them to this file like this:
# source = ~/.config/hypr/myColors.conf


################
### MONITORS ###
################

# See https://wiki.hypr.land/Configuring/Monitors/
monitor=,preferred,auto,auto


###################
### MY PROGRAMS ###
###################

# See https://wiki.hypr.land/Configuring/Keywords/

# Set programs that you use
$terminal = kitty
$fileManager = dolphin
$menu = rofi -show drun -theme ~/.config/rofi/minimal-gray.rasi


#################
### AUTOSTART ###
#################

# Autostart necessary processes (like notifications daemons, status bars, etc.)
# Or execute your favorite apps at launch like this:

# exec-once = waybar & hyprpaper & firefox
# exec-once = swww-daemon
# exec-once = swww img ~/Pictures/Wallpapers/gray-gradient.png --transition-type fade --transition-duration 2

# Essential autostart for robustness
exec-once = dbus-update-activation-environment --systemd WAYLAND_DISPLAY XDG_CURRENT_DESKTOP
exec-once = systemctl --user import-environment WAYLAND_DISPLAY XDG_CURRENT_DESKTOP
exec-once = waybar

# Wallpaper daemon
exec-once = swww-daemon

# Set workspace 1 wallpaper on startup (waits for daemon to be ready)
exec-once = bash -c 'sleep 0.5 && swww img ~/Pictures/Wallpapers/minimal-nature.jpg --transition-type fade --transition-duration 1'

# Workspace-specific wallpapers (auto-changes when switching workspaces)
exec-once = bash -c 'sleep 1 && workspace-wallpaper-daemon' &


#############################
### ENVIRONMENT VARIABLES ###
#############################

# See https://wiki.hypr.land/Configuring/Environment-variables/

env = XCURSOR_SIZE,24
env = HYPRCURSOR_SIZE,24


###################
### PERMISSIONS ###
###################

# See https://wiki.hypr.land/Configuring/Permissions/
# Please note permission changes here require a Hyprland restart and are not applied on-the-fly
# for security reasons

# ecosystem {
#   enforce_permissions = 1
# }

# permission = /usr/(bin|local/bin)/grim, screencopy, allow
# permission = /usr/(lib|libexec|lib64)/xdg-desktop-portal-hyprland, screencopy, allow
# permission = /usr/(bin|local/bin)/hyprpm, plugin, allow


#####################
### LOOK AND FEEL ###
#####################

# Refer to https://wiki.hypr.land/Configuring/Variables/

# https://wiki.hypr.land/Configuring/Variables/#general
general {
    gaps_in = 5
    gaps_out = 25

    border_size = 2

    # Minimal & clean color scheme - subtle grays
    col.active_border = rgba(888888ee)   # Soft gray for active windows
    col.inactive_border = rgba(333333aa) # Dark gray for inactive windows

    # Enable resizing windows by clicking and dragging on borders and gaps
    resize_on_border = true

    # Please see https://wiki.hypr.land/Configuring/Tearing/ before you turn this on
    allow_tearing = false

    layout = dwindle
}

# https://wiki.hypr.land/Configuring/Variables/#decoration
decoration {
    rounding = 8
    rounding_power = 2

    # Change transparency of focused and unfocused windows
    active_opacity = 1.0
    inactive_opacity = 0.95

    shadow {
        enabled = true
        range = 8
        render_power = 2
        color = rgba(00000099)  # Subtle shadow for depth
    }

    # https://wiki.hypr.land/Configuring/Variables/#blur
    blur {
        enabled = true
        size = 4
        passes = 2

        vibrancy = 0.15
        noise = 0.01  # Subtle noise for texture
    }
}

# https://wiki.hypr.land/Configuring/Variables/#animations
# FAST & SNAPPY animations for productivity
animations {
    enabled = true

    # Fast curves optimized for snappy feel
    #        NAME,      X0,   Y0,   X1,   Y1
    bezier = snap,      0.1,  0,    0.2,  1     # Very fast and responsive
    bezier = quick,     0.25, 0,    0.4,  1     # Quick but smooth
    bezier = instant,   0,    0,    1,    1     # Nearly instant

    # Fast animations - prioritize speed over elegance
    #           NAME,          ONOFF, SPEED, CURVE,   [STYLE]
    animation = windows,       1,     2,     snap,    popin 90%
    animation = windowsIn,     1,     2,     snap,    popin 90%
    animation = windowsOut,    1,     1.5,   instant, popin 90%
    animation = windowsMove,   1,     2,     quick
    animation = border,        1,     3,     quick
    animation = borderangle,   1,     10,    instant
    animation = fade,          1,     3,     quick
    animation = fadeIn,        1,     2,     quick
    animation = fadeOut,       1,     1.5,   instant
    animation = layers,        1,     2,     quick
    animation = layersIn,      1,     2,     quick,   fade
    animation = layersOut,     1,     1.5,   instant, fade
    animation = workspaces,    1,     3,     quick,   slide
    animation = specialWorkspace, 1,  2,     snap,    slidevert
}

# Ref https://wiki.hypr.land/Configuring/Workspace-Rules/
# "Smart gaps" / "No gaps when only"
# uncomment all if you wish to use that.
# workspace = w[tv1], gapsout:0, gapsin:0
# workspace = f[1], gapsout:0, gapsin:0
# windowrule {
#     name = no-gaps-wtv1
#     match:float = false
#     match:workspace = w[tv1]
#
#     border_size = 0
#     rounding = 0
# }
#
# windowrule {
#     name = no-gaps-f1
#     match:float = false
#     match:workspace = f[1]
#
#     border_size = 0
#     rounding = 0
# }

# See https://wiki.hypr.land/Configuring/Dwindle-Layout/ for more
dwindle {
    pseudotile = false      # Disable pseudo-tiling (windows fill their tile)
    preserve_split = true   # Keep split direction when closing windows
    force_split = 2         # Always split to the right/bottom
    smart_split = false     # Consistent split behavior
}

# See https://wiki.hypr.land/Configuring/Master-Layout/ for more
master {
    new_status = master
    new_on_top = false
    mfact = 0.55              # Master window takes 55% of screen (center)
    orientation = center      # Master centered, slaves on both sides
}

# https://wiki.hypr.land/Configuring/Variables/#misc
misc {
    force_default_wallpaper = 0  # Disable anime mascot for minimal aesthetic
    disable_hyprland_logo = true # Clean, professional look
    vfr = true                    # Variable frame rate for better performance
    vrr = 1                       # Variable refresh rate support
    mouse_move_enables_dpms = true  # Wake on mouse movement
    key_press_enables_dpms = true   # Wake on key press
    disable_autoreload = false    # Auto-reload config on changes
    focus_on_activate = true      # Focus windows when activated
}


#############
### INPUT ###
#############

# https://wiki.hypr.land/Configuring/Variables/#input
input {
    kb_layout = us
    kb_variant =
    kb_model =
    kb_options =
    kb_rules =

    follow_mouse = 1

    sensitivity = 0 # -1.0 - 1.0, 0 means no modification.

    touchpad {
        natural_scroll = true
        disable_while_typing = true
        tap-to-click = true
        drag_lock = false
        scroll_factor = 1.0
    }
}

# Gestures disabled - removed due to config errors

# Example per-device config
# See https://wiki.hypr.land/Configuring/Keywords/#per-device-input-configs for more
device {
    name = epic-mouse-v1
    sensitivity = -0.5
}


###################
### KEYBINDINGS ###
###################

# See https://wiki.hypr.land/Configuring/Keywords/
$mainMod = SUPER # Sets "Windows" key as main modifier

# Example binds, see https://wiki.hypr.land/Configuring/Binds/ for more
bind = $mainMod, Q, exec, $terminal
bind = $mainMod, C, killactive,
bind = $mainMod, M, exec, command -v hyprshutdown >/dev/null 2>&1 && hyprshutdown || hyprctl dispatch exit
bind = $mainMod, E, exec, $fileManager
bind = $mainMod, V, togglefloating,
bind = $mainMod, R, exec, $menu
bind = $mainMod, P, pseudo, # dwindle (legacy)
bind = $mainMod, J, layoutmsg, swapwithmaster # master layout - swap focused window with master
bind = $mainMod, O, layoutmsg, orientationcycle center left # master layout - cycle orientation

# Move focus with mainMod + arrow keys
bind = $mainMod, left, movefocus, l
bind = $mainMod, right, movefocus, r
bind = $mainMod, up, movefocus, u
bind = $mainMod, down, movefocus, d

# Switch workspaces with mainMod + [1-6]
bind = $mainMod, 1, workspace, 1
bind = $mainMod, 2, workspace, 2
bind = $mainMod, 3, workspace, 3
bind = $mainMod, 4, workspace, 4
bind = $mainMod, 5, workspace, 5
bind = $mainMod, 6, workspace, 6

# Move active window to a workspace with mainMod + SHIFT + [1-6]
bind = $mainMod SHIFT, 1, movetoworkspace, 1
bind = $mainMod SHIFT, 2, movetoworkspace, 2
bind = $mainMod SHIFT, 3, movetoworkspace, 3
bind = $mainMod SHIFT, 4, movetoworkspace, 4
bind = $mainMod SHIFT, 5, movetoworkspace, 5
bind = $mainMod SHIFT, 6, movetoworkspace, 6

# Example special workspace (scratchpad)
bind = $mainMod, S, togglespecialworkspace, magic
bind = $mainMod SHIFT, S, movetoworkspace, special:magic

# Float/Tile mode controls
bind = $mainMod, T, exec, smart-toggle-float  # Toggle float (centers & sizes when floating)
bind = $mainMod, F, fullscreen, 1             # Maximize (keeps bar)
bind = $mainMod SHIFT, F, fullscreen, 0       # True fullscreen
bind = $mainMod, Tab, cyclenext,              # Cycle through windows
bind = $mainMod SHIFT, Tab, swapnext,         # Swap with next window

# Scroll through existing workspaces with mainMod + scroll
bind = $mainMod, mouse_down, workspace, e+1
bind = $mainMod, mouse_up, workspace, e-1

# Move/resize windows with mainMod + LMB/RMB and dragging
bindm = $mainMod, mouse:272, movewindow
bindm = $mainMod, mouse:273, resizewindow

# Wallpaper switching
bind = $mainMod CTRL, right, exec, wallpaper-switcher next
bind = $mainMod CTRL, left, exec, wallpaper-switcher prev
bind = $mainMod CTRL, R, exec, wallpaper-switcher random

# Laptop multimedia keys for volume and LCD brightness
bindel = ,XF86AudioRaiseVolume, exec, wpctl set-volume -l 1 @DEFAULT_AUDIO_SINK@ 5%+
bindel = ,XF86AudioLowerVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
bindel = ,XF86AudioMute, exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
bindel = ,XF86AudioMicMute, exec, wpctl set-mute @DEFAULT_AUDIO_SOURCE@ toggle
bindel = ,XF86MonBrightnessUp, exec, brightnessctl -e4 -n2 set 5%+
bindel = ,XF86MonBrightnessDown, exec, brightnessctl -e4 -n2 set 5%-

# Requires playerctl
bindl = , XF86AudioNext, exec, playerctl next
bindl = , XF86AudioPause, exec, playerctl play-pause
bindl = , XF86AudioPlay, exec, playerctl play-pause
bindl = , XF86AudioPrev, exec, playerctl previous

##############################
### WINDOWS AND WORKSPACES ###
##############################

# See https://wiki.hypr.land/Configuring/Window-Rules/ for more
# See https://wiki.hypr.land/Configuring/Workspace-Rules/ for workspace rules

# Example windowrules that are useful

windowrule {
    # Ignore maximize requests from all apps. You'll probably like this.
    name = suppress-maximize-events
    match:class = .*

    suppress_event = maximize
}

windowrule {
    # Fix some dragging issues with XWayland
    name = fix-xwayland-drags
    match:class = ^$
    match:title = ^$
    match:xwayland = true
    match:float = true
    match:fullscreen = false
    match:pin = false

    no_focus = true
}

# Hyprland-run windowrule
windowrule {
    name = move-hyprland-run

    match:class = hyprland-run

    move = 20 monitor_h-120
    float = yes
}

# Floating window rules for common applications
windowrule {
    name = float-file-managers
    match:class = (org.kde.polkit-kde-authentication-agent-1|pavucontrol|blueman-manager)

    float = yes
    center = yes
}

windowrule {
    name = float-picture-in-picture
    match:title = (Picture-in-Picture|^pip$)

    float = yes
    pin = yes
    size = 640 360
}

windowrule {
    name = float-system-dialogs
    match:class = (xdg-desktop-portal-gtk)

    float = yes
    center = yes
}

# Workspace rules (6 workspaces)
workspace = 1, monitor:default, default:true
workspace = 2, monitor:default
workspace = 3, monitor:default
workspace = 4, monitor:default
workspace = 5, monitor:default
workspace = 6, monitor:default

# =============================================
# FLOAT BY DEFAULT - Press Super+T to tile
# =============================================

# Terminal-specific rules (Kitty) - Tile by default, Float with Super+T
windowrule {
    name = kitty-tiling-default
    match:class = ^(kitty)$

    opacity = 0.85 0.85
    float = no
}

# All windows float centered by default
windowrulev2 = float, class:^(.*)$
windowrulev2 = center, class:^(.*)$
windowrulev2 = size 75% 80%, class:^(.*)$
