# Tmux Configuration
# Prefix: Ctrl-a

set -g prefix C-a
unbind C-b
bind C-a send-prefix

set -g default-shell /bin/zsh
setw -g mode-keys vi
set -g mouse on
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
set -g allow-rename off
set -s escape-time 0

bind o split-window -v -c "#{pane_current_path}"
bind a split-window -h -c "#{pane_current_path}"
bind X kill-pane
bind x kill-window

bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

bind r source-file ~/.config/tmux/tmux.conf

set -g status-position top
set -g status-style bg=colour234,fg=white
set -g status-left-length 40
set -g status-right-length 80
setw -g window-status-style bg=colour235,fg=white
setw -g window-status-current-style bg=colour208,fg=white
set -g pane-border-style fg=colour235
set -g pane-active-border-style fg=colour240
set -g message-style bg=colour235,fg=white
