[main]
terminal=ghostty -e
width=60
icon-theme=breeze-dark
show-actions=yes
layer=overlay
font=JetBrainsMono Nerd Font:size=13
horizontal-pad=20
vertical-pad=12
inner-pad=8

[colors]
# Deep red theme matching waybar
background=140c0cf5
text=e0e0e0ff
match=c41e3aff
selection=b41e32dd
selection-text=ffffffff
selection-match=ffffffff
border=b41e3299

[border]
width=2
radius=12

[dmenu]
mode=text
exit-immediately-if-empty=yes
