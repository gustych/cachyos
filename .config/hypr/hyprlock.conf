# Minimal local lock screen; PAM authentication uses the installed hyprlock defaults.
background {
    monitor =
    color = rgba(181818ff)
}
input-field {
    monitor =
    size = 320, 60
    position = 0, 0
    halign = center
    valign = center
    outer_color = rgba(888888ff)
    inner_color = rgba(222222ff)
    font_color = rgba(eeeeeeff)
    placeholder_text = Password to unlock
    fail_text = Authentication failed
}
